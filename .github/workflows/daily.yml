name: daily spike check

on:
  schedule:
    # tcgcsv publishes around 20:00 UTC; give it a margin.
    - cron: "35 20 * * *"
  workflow_dispatch:

# Committing the day file each run is what keeps this workflow alive:
# GitHub disables scheduled workflows after 60 days of repository inactivity.
permissions:
  contents: write

concurrency:
  group: daily-spike-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Pulls the last few days rather than just today, so a missed run or a
      # tcgcsv outage heals itself instead of leaving a permanent gap. Days
      # already on disk are skipped, so this is cheap.
      - name: Fetch recent price snapshots
        run: python scripts/backfill.py --days 5

      # New sets appear regularly and a card with no catalog row can't be
      # identified in an alert. ~300 requests, well inside the daily budget.
      - name: Refresh catalog
        run: python scripts/catalog.py

      # Only the recent window is needed — the baseline looks back 7 days and
      # the page draws a 30-day sparkline.
      - name: Build database
        run: python scripts/db.py --days 45

      - name: Detect spikes
        run: python scripts/detect.py

      - name: Render page
        run: python scripts/page.py

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python scripts/notify.py

      - name: Commit
        run: |
          git config user.name "spike-tracker[bot]"
          git config user.email "actions@github.com"
          git add data/prices data/alerts data/catalog data/alert_history.csv docs
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
